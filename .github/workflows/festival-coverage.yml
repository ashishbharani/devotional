name: Festival coverage review inventory
on:
  workflow_dispatch:
    inputs:
      probe_references:
        description: Fetch selected published calendar facts as unapproved review proposals
        type: boolean
        default: false
      reference_year:
        description: Explicit published year to inspect (required only for the optional probe)
        type: string
        default: ''
  schedule:
    - cron: '15 4 1 11 *'
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Produce gap inventory without changing or approving dates
        run: |
          mkdir -p work/festival-coverage
          node scripts/audit_living_festival_coverage.mjs --write-tasks > work/festival-coverage/COVERAGE_MATRIX.md
      - uses: astral-sh/setup-uv@v6
        if: github.event_name == 'workflow_dispatch' && inputs.probe_references
      - name: Fetch proposals only; never approve or publish dates
        if: github.event_name == 'workflow_dispatch' && inputs.probe_references
        env:
          REFERENCE_YEAR: ${{ inputs.reference_year }}
        run: uv run python scripts/propose_festival_calendar_review.py --years "$REFERENCE_YEAR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: festival-coverage-review-required
          path: work/festival-coverage
