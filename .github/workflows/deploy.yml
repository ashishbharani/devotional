name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Test Panchang calculations and reference fixtures
        run: node scripts/test_panchang.mjs
      - name: Test ephemeris timezone boundaries and native Swiss golden fixtures
        run: node scripts/test_ephemeris.mjs
      - name: Build MkDocs site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: uv run mkdocs build --strict
      - name: Audit generated routes, canonical IDs, translations and PWA shell
        run: |
          uv run python scripts/check_site.py
          uv run python scripts/check_i18n.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
