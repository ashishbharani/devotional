name: Check pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the site (strict)
    runs-on: ubuntu-latest
    env:
      HDC_PRACTICE_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Test Panchang calculations and reference fixtures
        run: node scripts/test_panchang.mjs
      - name: Test ephemeris timezone boundaries and native Swiss golden fixtures
        run: node scripts/test_ephemeris.mjs
      - name: Build MkDocs site (every warning fails the check)
        run: uv run mkdocs build --strict 2>&1 | tee build.log
        shell: bash
      - name: Test homepage hook without an ambient repository import path
        run: uv run python -I scripts/test_homepage_hook.py
      - name: Audit generated routes, canonical IDs, translations and PWA shell
        run: |
          uv run python scripts/check_site.py
          uv run python scripts/test_social_metadata.py
          uv run python scripts/test_practice_release_gate.py enabled
          uv run python scripts/test_seo_structure.py enabled
          uv run python scripts/test_section_pager.py
          uv run python scripts/check_i18n.py
          uv run python scripts/check_project_pdfs.py
          uv run python scripts/test_reading_links.py
      - name: Test owner-approved deity artwork and exact identity mappings
        run: uv run python scripts/test_deity_art.py
      - name: Test universal search coverage, graph and multilingual ranking
        run: node scripts/test_universal_search.mjs
      - name: Test universal search on phones, tablets and desktops
        run: node scripts/test_search_browser.mjs
        env:
          SEARCH_SCREENSHOTS: work/search-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-search-screenshots
          path: work/search-browser
      - name: Test official pages, PDFs and responsive footer
        run: node scripts/test_project_info_browser.mjs
        env:
          PROJECT_SCREENSHOTS: work/project-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-project-browser-screenshots
          path: work/project-browser
      - name: Test Panchang browser views and mobile layouts
        run: pnpm test:browser
        env:
          PANCHANG_SCREENSHOTS: work/panchang-browser
      - name: Test compact navigation, categories, keyboard and search
        run: node scripts/test_navigation.mjs
      - name: Test royal homepage, artwork, search and destination links
        run: node scripts/test_royal_homepage.mjs
      - name: Test Daily Darshan, existing Japa state and responsive discovery
        run: node scripts/test_daily_darshan_browser.mjs
      - name: Test local journeys, canonical discovery and public sharing
        run: node scripts/test_journey_discovery_browser.mjs
      - name: Test reading continuation, cross-tab state and shareable filters
        run: node scripts/test_continuation_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuation-flow-screenshots
          path: work/continuation
      - name: Verify first-install offline routines and record local performance snapshot
        run: |
          node scripts/test_lab_metrics.mjs
          node scripts/test_pwa_release_browser.mjs
          node scripts/test_pwa_upgrade_browser.mjs
      - name: Audit shared design tokens, enhanced reading and keyboard contrast
        run: node scripts/test_design_system_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-and-worker-upgrade-evidence
          path: |
            work/design-system
            work/pwa-upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qa-lab-evidence
          path: work/release-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-discovery-screenshots
          path: work/journey-discovery
      - name: Test optional Sanctuary and source-attributed Sacred Reader pilot
        run: node scripts/test_practice_browser.mjs
      - name: Test festival schedule validation, India-time boundaries and preview UI
        run: |
          node scripts/test_festival_themes.mjs
          node scripts/test_festival_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: festival-preview-screenshots
          path: work/festival-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanctuary-reader-screenshots
          path: work/practice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-darshan-screenshots
          path: work/daily-darshan
      - name: Test shared sacred design on every page type
        run: node scripts/test_sacred_site.mjs
      - name: Verify existing HDC plugins, legacy data and restored offline styles
        run: node scripts/test_hdc_plugins_browser.mjs
      - name: Test approved header and explicit PWA installation states
        run: node scripts/test_approved_header_browser.mjs
      - name: Test approved-reference header proportions and mobile hero placement
        run: node scripts/test_header_fidelity_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: header-reference-comparison-screenshots
          path: work/header-fidelity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-header-staging-screenshots
          path: work/approved-header-staging
      - name: Test optional in-page translation consent and preference safety
        run: node scripts/test_translation_browser.mjs
      - name: Test English library handoffs and Vrat Katha / Parayan discovery
        run: node scripts/test_reading_links_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-links-screenshots
          path: work/reading-links
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-picker-screenshots
          path: work/translation-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdc-plugin-branding-screenshots
          path: work/hdc-plugin-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sacred-site-screenshots
          path: work/sacred-site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: royal-homepage-screenshots
          path: work/royal-homepage
      - name: Test feedback UI, context, accessibility and mocked submissions
        run: node scripts/test_feedback_browser.mjs
        env:
          FEEDBACK_SCREENSHOTS: work/feedback-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-browser-screenshots
          path: work/feedback-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panchang-browser-screenshots
          path: work/panchang-browser
      - name: Verify default production keeps unfinished practice features disabled
        env:
          HDC_PRACTICE_PREVIEW: ''
        run: |
          uv run mkdocs build --strict
          uv run python scripts/test_practice_release_gate.py disabled
          uv run python scripts/test_seo_structure.py disabled
      - name: Explain problems in plain language
        if: failure()
        shell: bash
        run: |
          {
            echo "### ❌ Website validation failed"
            echo "Open the first failing step above for its exact error. This excerpt is from the build log; browser and data tests have their own step logs."
            echo '```'
            grep -E "WARNING|ERROR" build.log || tail -n 20 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
