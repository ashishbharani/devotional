site_name: Hindu Devotional Collection
site_description: A Pan-India Multilingual Devotional Reference — collected & compiled by Ashish Bharani
site_author: Ashish Bharani
# GitHub Actions passes the real Pages URL in SITE_URL; the default is used for local builds
site_url: !ENV [SITE_URL, "https://ashishbharani.github.io/devotional/"]
copyright: Collected &amp; compiled by Ashish Bharani · Reworked Publication 2026

# Every page is generated from data/collection.json by hooks/generate.py.
# A hand-written file placed in docs/ with the same path overrides the generated page.
docs_dir: docs
hooks:
  - hooks/generate.py

theme:
  name: material
  custom_dir: theme            # the "ABP Devotional" theme: templates + partials
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/favicon-32.png
  font: false                  # fonts are loaded by the theme (Noto Serif / Noto Sans)
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: abp-light
      toggle:
        icon: material/weather-night
        name: Switch to dark (lamp-light) mode
    - media: "(prefers-color-scheme: dark)"
      scheme: abp-dark
      toggle:
        icon: material/weather-sunny
        name: Switch to light (parchment) mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

extra:
  generator: false

extra_css:
  - stylesheets/abp.css
  - stylesheets/feedback.css
extra_javascript:
  - javascripts/abp-transliterate.js
  - javascripts/abp-i18n.js
  - javascripts/abp-firebase-config.js
  - javascripts/abp-firebase.js
  - javascripts/abp-favourites.js
  - javascripts/abp-auth.js
  - javascripts/abp.js
  - javascripts/abp-directory.js
  - javascripts/abp-japa.js
  - javascripts/abp-panchang.js
  - javascripts/abp-ephemeris.js
  - javascripts/abp-pwa.js
  - javascripts/abp-a11y.js
  - javascripts/feedback.js

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: false
      toc_depth: 3

validation:
  nav:
    omitted_files: ignore      # group pages are reached from category pages, not the sidebar
